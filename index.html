<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>バニラJSでのTODOアプリ作成課題</title>
</head>

<body>
    <input type="text" id="todo-input">
    <button id="add-button">追加</button>

    <h2>TODO一覧</h2>
    <div>
        <p>全てのタスク: <span id="all-todo-count">0</span></p>
        <p>完了: <span id="done-todo-count">0</span></p>
        <p>未完了: <span id="not-done-todo-count">0</span></p>
    </div>
    <ul id="todo-list">
    </ul>

    <div id="delete-confirm-modal" style="display: none;">
        <p>本当に削除しますか？</p>
        <p id="delete-target-item"></p>
        <button id="delete-confirm-button">はい</button>
        <button id="delete-cancel-button">いいえ</button>
    </div>
</body>

<script src="main.js"></script>

</html>
